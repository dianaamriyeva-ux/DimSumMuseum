<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360">
  <!-- A slice of vasilopita with the lucky coin. Flat style to match the other object drawings. -->
  <!-- outer crust -->
  <path d="M330 92 L346 176 L346 250 L330 166 Z" fill="#a85f22" stroke="#1d1d1b" stroke-width="5" stroke-linejoin="round"/>
  <!-- cut side -->
  <path d="M46 168 L346 176 L346 250 L46 222 Z" fill="#f0c27a" stroke="#1d1d1b" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#d99a4e"><circle cx="110" cy="196" r="5"/><circle cx="170" cy="210" r="4"/><circle cx="236" cy="200" r="5"/>
    <circle cx="300" cy="222" r="4"/><circle cx="140" cy="214" r="3"/><circle cx="276" cy="196" r="3"/></g>
  <path d="M46 168 L346 176" stroke="#c98a3c" stroke-width="10" stroke-linecap="round" opacity=".5"/>
  <!-- sugar top -->
  <path d="M46 168 L330 92 L346 176 Z" fill="#fbf6ec" stroke="#1d1d1b" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#e6dcc7"><circle cx="230" cy="140" r="4"/><circle cx="290" cy="130" r="3"/><circle cx="180" cy="160" r="3"/></g>
  <!-- the coin -->
  <g transform="translate(270 262)">
    <circle r="62" fill="#f2c14e" stroke="#1d1d1b" stroke-width="5"/>
    <circle r="46" fill="none" stroke="#c4922b" stroke-width="5"/>
    <text y="13" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#8a6316">2026</text>
    <path d="M-36 -32 A 48 48 0 0 1 4 -48" fill="none" stroke="#fff3c4" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g fill="#e0a95c"><circle cx="160" cy="292" r="5"/><circle cx="186" cy="306" r="3.5"/><circle cx="356" cy="316" r="4"/></g>
</svg>
